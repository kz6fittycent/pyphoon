name: pyphoon
version: '0.2'
summary: ASCII Art Phase of the Moon!
description: |
  ASCII Art Phase of the Moon (Python version)

license: MIT

base: core24
grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  pyphoon:
    command: bin/pyphoon
    environment:
      LC_ALL: C.UTF-8
    plugs:
      - network

parts:
  pyphoon:
    source: https://github.com/chubin/pyphoon
    source-type: git
    plugin: python
    # setup.py pulls in python-dateutil. upstream hasn't tagged a release, so
    # the version stays pinned above.
